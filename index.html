<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geologic Time taught by Star Wars</title>
<meta name="description" content="Geologic time and the running time of The Empire Strikes Back on one timeline, station by station.">
<meta name="theme-color" content="#000">
<style>
:root { --bg: #000; --ink: #f4f1e6; --muted: #a9a59a; --gold: #ffe81f; --cyan: #65f4f4; --card: rgba(8, 10, 18, .78); --line: rgba(255, 232, 31, .35); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 17px/1.6 Helvetica, Arial, sans-serif; overflow: hidden; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
a { color: var(--cyan); }
button { font: inherit; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 1.1rem; background: linear-gradient(#000 40%, rgba(0,0,0,0)); }
.top a { color: var(--muted); text-decoration: none; font-size: .9rem; }
.top a:hover, .top a:focus-visible { color: var(--ink); }
.top .name { color: var(--gold); text-transform: uppercase; letter-spacing: .18em; font-size: .78rem; font-weight: 700; }
main { position: relative; z-index: 2; height: 100%; }
[hidden] { display: none !important; }

/* the explainer */
/* (2026-10-15) centred with margin: auto, not align-items: center, which pushed a long explainer off the top where it can't be scrolled to */
#intro { height: 100%; overflow-y: auto; display: flex; padding: 4.5rem 1.2rem 2.5rem; }
.intro-in { max-width: 42rem; margin: auto; text-align: center; }
.intro-in h1 { margin: 0 0 1.4rem; color: var(--gold); font: 800 clamp(2rem, 6vw, 3.6rem)/1.08 Helvetica, Arial, sans-serif; text-transform: uppercase; letter-spacing: .06em; text-shadow: 0 0 24px rgba(255, 232, 31, .25); }
.intro-text p { margin: 0 0 1em; color: #efe9cf; font-size: 1.12rem; text-align: left; }
.enter { margin-top: 1.2rem; border: 2px solid var(--gold); background: transparent; color: var(--gold); padding: .85rem 1.8rem; border-radius: 999px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
.enter:hover, .enter:focus-visible { background: var(--gold); color: #000; outline: none; }
.soon { color: var(--muted); }

/* the timeline */
#line { height: 100%; display: grid; grid-template-rows: 1fr auto; }
.stage { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 4rem 5.5rem 1rem; }
.card { width: min(46rem, 100%); max-height: 100%; overflow-y: auto; background: var(--card); border: 1px solid rgba(255, 255, 255, .08); border-radius: 18px; padding: 1.6rem 1.8rem; backdrop-filter: blur(3px); }
.card.go { transition: transform .45s cubic-bezier(.5, 0, .2, 1), opacity .45s, filter .45s; }
.when { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; align-items: baseline; margin-bottom: .5rem; }
.when .geo { color: var(--cyan); font-weight: 800; font-size: 1.15rem; }
.when .film { color: var(--gold); font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.when .film::before { content: ""; display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--gold); margin-right: .45rem; vertical-align: .1em; }
.when .geo::before { content: ""; display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--cyan); margin-right: .45rem; vertical-align: .1em; }
.card h2 { margin: 0 0 .8rem; font: 800 clamp(1.4rem, 3.4vw, 2.1rem)/1.15 Helvetica, Arial, sans-serif; color: #fff; }
.body p { margin: 0 0 .9em; }
.card figure { margin: 1rem 0; }
.card img { display: block; max-width: 100%; max-height: 55vh; width: auto; height: auto; object-fit: contain; border-radius: 10px; margin: 0 auto; }
.card figcaption { color: var(--muted); font-size: .9rem; margin-top: .4rem; text-align: center; }
.video { position: relative; aspect-ratio: 16 / 9; margin: 1rem 0; border-radius: 10px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.count { color: var(--muted); font-size: .85rem; margin-top: .6rem; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 3.6rem; height: 3.6rem; border-radius: 50%; border: 2px solid var(--gold); background: rgba(0, 0, 0, .55); color: var(--gold); cursor: pointer; display: grid; place-items: center; padding: 0; }
.arrow svg { width: 1.6rem; height: 1.6rem; }
@media (max-width: 700px) { .arrow svg { width: 1.3rem; height: 1.3rem; } }
.arrow:hover:not(:disabled), .arrow:focus-visible { background: var(--gold); color: #000; outline: none; }
.arrow:disabled { opacity: .25; cursor: default; }
.prev { left: 1.1rem; } .next { right: 1.1rem; }

/* the track: one scale (geologic above, Star Wars below) */
.track { position: relative; height: 7.4rem; margin: 0 2rem .6rem; }
.track .rail { position: absolute; left: 0; right: 0; top: 2.9rem; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--gold)); opacity: .55; }
.track .dot { position: absolute; top: 2.9rem; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 0; background: #d9d4c0; cursor: pointer; padding: 0; }
.track .dot::after { content: ""; position: absolute; inset: -10px; }   /* a bigger target than it looks */
.track .dot.on { background: var(--gold); box-shadow: 0 0 0 5px rgba(255, 232, 31, .25), 0 0 18px var(--gold); }
.track .dot.present { background: var(--cyan); }
.track .lab { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: .82rem; font-weight: 700; transition: left .45s cubic-bezier(.5, 0, .2, 1); }
.track .lab.geo { top: .6rem; color: var(--cyan); } .track .lab.film { top: 3.9rem; color: var(--gold); }
.track .end { position: absolute; bottom: .2rem; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.track .end.l { left: 0; } .track .end.r { right: 0; }
@media (max-width: 700px) {
  html, body { font-size: 16px; }
  .stage { padding: 3.6rem .8rem .5rem; }
  .card { padding: 1.2rem 1.1rem; }
  .arrow { top: auto; bottom: .4rem; transform: none; width: 3rem; height: 3rem; font-size: 1.4rem; }
  .track { margin: 0 4rem .8rem; }
  .top .home { display: none; }
  .top .name { font-size: .68rem; letter-spacing: .12em; text-align: right; }
}
@media (prefers-reduced-motion: reduce) { .card.go, .track .lab { transition: opacity .2s; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<header class="top"><a href="https://ethandavidmagalei.com/projects/">&larr; Ethan David Magalei</a><span class="name" id="topname"></span><a class="home" href="https://github.com/edscott321/geologic-time-star-wars">Source</a></header>
<main>
  <section id="intro" aria-labelledby="intro-h">
    <div class="intro-in">
      <h1 id="intro-h">Geologic Time taught by Star Wars</h1>
      <div class="intro-text" id="intro-text"></div>
      <p class="soon" id="soon" hidden>Coming soon.</p>
      <button type="button" class="enter" id="enter" hidden>Enter the timeline</button>
    </div>
  </section>
  <section id="line" hidden aria-label="The timeline">
    <div class="stage" id="stage">
      <button type="button" class="arrow prev" id="prev" aria-label="Back in time"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <article class="card" id="card" aria-live="polite"></article>
      <button type="button" class="arrow next" id="next" aria-label="Forward in time"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="track" id="track" role="group" aria-label="Every station, furthest back to present day"></div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var events = [], at = 0, busy = false, topTitle = '';

  // ---- the sky: a slow starfield; a jump streaks every star sideways (the direction of travel) and settles ----
  var cv = $('sky'), g = cv.getContext('2d'), W = 0, H = 0, dpr = 1, stars = [], warp = { t: 0, dir: 0, start: 0 };
  function size() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); if (!stars.length) seed(); }
  function seed() { var n = Math.round(Math.min(900, W * H / 1800)); for (var i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random(), tw: Math.random() * 6.28 }); }
  addEventListener('resize', function () { size(); });
  size();
  var WARP_MS = 900;
  function frame(now) {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    var k = 0;   // 0 = still, rising to 1 mid-jump and back
    if (warp.dir) { var p = (now - warp.start) / WARP_MS; if (p >= 1) warp.dir = 0; else k = Math.sin(p * Math.PI); }
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], depth = .25 + s.z * .75;
      s.x -= (0.00002 + k * 0.03 * depth) * (warp.dir || 1) * (warp.dir ? 1 : depth);
      if (s.x < 0) s.x += 1; if (s.x > 1) s.x -= 1;
      var x = s.x * W, y = s.y * H, a = .35 + .65 * depth * (.7 + .3 * Math.sin(now / 900 + s.tw));
      if (k > .02) {
        var len = k * 260 * depth * (W / 1200 + .4);
        var grad = g.createLinearGradient(x, y, x + len * (warp.dir || 1), y);
        grad.addColorStop(0, 'rgba(255,255,255,' + a + ')'); grad.addColorStop(1, 'rgba(150,200,255,0)');
        g.strokeStyle = grad; g.lineWidth = .6 + depth * 1.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len * (warp.dir || 1), y); g.stroke();
      } else { g.fillStyle = 'rgba(255,255,255,' + a + ')'; var r = .4 + depth * 1.1; g.fillRect(x - r / 2, y - r / 2, r, r); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- words: blank lines are paragraphs; [words](https://…) is a link; built as elements, never HTML ----
  function para(box, txt) {
    String(txt || '').split(/\n{2,}/).forEach(function (chunk) {
      if (!chunk.trim()) return;
      var p = document.createElement('p'), re = /\[([^\]]{1,120})\]\((https?:\/\/[^\s)]{1,400}|\/[^\s)]{0,300})\)/g, last = 0, m;
      var lines = function (t) { t.split('\n').forEach(function (l, i) { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); }); };
      while ((m = re.exec(chunk))) { lines(chunk.slice(last, m.index)); var a = document.createElement('a'); a.href = m[2]; a.textContent = m[1]; if (/^https?:/.test(m[2])) { a.target = '_blank'; a.rel = 'noopener'; } p.appendChild(a); last = re.lastIndex; }
      lines(chunk.slice(last)); box.appendChild(p);
    });
  }

  // ---- the station card ----
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fill(card, e, i) {
    card.textContent = '';
    var when = el('div', 'when');
    if (e.geo) when.appendChild(el('span', 'geo', e.geo));
    if (e.film) when.appendChild(el('span', 'film', e.film));
    if (when.children.length) card.appendChild(when);
    if (e.title) card.appendChild(el('h2', null, e.title));
    var body = el('div', 'body'); para(body, e.body); card.appendChild(body);
    (e.images || []).forEach(function (im) {
      var f = el('figure'), img = el('img'); img.src = im.src; img.alt = im.alt || ''; img.loading = 'lazy'; img.decoding = 'async';
      if (im.w && im.h) { img.width = im.w; img.height = im.h; }
      f.appendChild(img); if (im.caption) f.appendChild(el('figcaption', null, im.caption)); card.appendChild(f);
    });
    if (e.video) {
      var v = el('div', 'video'), fr = document.createElement('iframe');
      fr.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(e.video) + '?rel=0';
      fr.title = e.title ? 'Video: ' + e.title : 'Video'; fr.loading = 'lazy'; fr.allow = 'encrypted-media; picture-in-picture; fullscreen'; fr.allowFullscreen = true; fr.referrerPolicy = 'strict-origin-when-cross-origin';
      v.appendChild(fr); card.appendChild(v);
    }
    card.appendChild(el('p', 'count', 'Station ' + (i + 1) + ' of ' + events.length));
    card.scrollTop = 0;
  }

  // ---- the track: stations spaced by their place on the scale; present day at the far right ----
  var spots = [];
  function place() {
    // Linear in each station's number (smallest far left); present day always at the far right. If present day has no
    // number of its own, the rest end a little short of it. Stations without a number sit evenly between neighbours.
    var nums = events.filter(function (e) { return e.pos != null; }).map(function (e) { return e.pos; });
    var lo = nums.length ? Math.min.apply(null, nums) : 0, hi = nums.length ? Math.max.apply(null, nums) : 1, span = hi - lo;
    var pres = events.filter(function (e) { return e.present; })[0], room = pres && pres.pos == null ? .94 : 1;
    spots = events.map(function (e) { return e.present ? 1 : e.pos == null ? null : span ? (e.pos - lo) / span * room : 0; });
    for (var i = 0; i < spots.length; i++) if (spots[i] == null) {
      var a = i - 1, b = i + 1; while (b < spots.length && spots[b] == null) b++;
      var x0 = a >= 0 ? spots[a] : 0, x1 = b < spots.length ? spots[b] : 1; spots[i] = x0 + (x1 - x0) / (b - a);
    }
  }
  function drawTrack() {
    var t = $('track'); t.textContent = '';
    t.appendChild(el('div', 'rail'));
    var l = el('span', 'end l', 'Furthest back'), r = el('span', 'end r', 'Present day'); t.appendChild(l); t.appendChild(r);
    events.forEach(function (e, i) {
      var d = el('button', 'dot' + (e.present ? ' present' : '') + (i === at ? ' on' : '')); d.type = 'button';
      d.style.left = (spots[i] * 100) + '%'; d.setAttribute('aria-label', (e.title || e.geo || 'Station ' + (i + 1)) + (e.geo ? ', ' + e.geo : '') + (e.film ? ', ' + e.film : ''));
      if (i === at) d.setAttribute('aria-current', 'step');
      d.onclick = function () { go(i); };
      t.appendChild(d);
    });
    var cur = events[at] || {}, x = spots[at] * 100 + '%';
    var lg = el('span', 'lab geo', cur.geo || ''), lf = el('span', 'lab film', cur.film || '');
    lg.style.left = lf.style.left = 'clamp(3.5rem, ' + x + ', calc(100% - 3.5rem))';
    t.appendChild(lg); t.appendChild(lf);
  }
  function arrows() { $('prev').disabled = at <= 0; $('next').disabled = at >= events.length - 1; }

  // ---- travelling: streak, slide the card out the far side, the new one in from the near side ----
  function go(i) {
    if (busy || i === at || i < 0 || i >= events.length) return;
    var dir = i > at ? 1 : -1, card = $('card');
    at = i; history.replaceState(null, '', location.pathname + location.search + '#s=' + (at + 1));
    if (still) { fill(card, events[at], at); drawTrack(); arrows(); return; }
    busy = true; warp.dir = dir; warp.start = performance.now();
    card.classList.add('go'); card.style.transform = 'translateX(' + (-dir * 60) + 'vw)'; card.style.opacity = '0'; card.style.filter = 'blur(6px)';
    setTimeout(function () {
      card.classList.remove('go'); card.style.transform = 'translateX(' + (dir * 60) + 'vw)';
      fill(card, events[at], at); drawTrack(); arrows();
      requestAnimationFrame(function () { requestAnimationFrame(function () { card.classList.add('go'); card.style.transform = ''; card.style.opacity = ''; card.style.filter = ''; }); });
      setTimeout(function () { busy = false; card.classList.remove('go'); }, 480);
    }, 450);
  }
  $('prev').onclick = function () { go(at - 1); };
  $('next').onclick = function () { go(at + 1); };
  addEventListener('keydown', function (e) {
    if ($('line').hidden || (e.target.closest && e.target.closest('input, textarea'))) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(at + 1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); go(at - 1); }
  });
  var tx = null, ty = null;
  $('stage').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('stage').addEventListener('touchend', function (e) {
    if (tx == null) return; var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(at + (dx < 0 ? 1 : -1));
  }, { passive: true });

  function enter(i) {
    $('intro').hidden = true; $('line').hidden = false; $('topname').textContent = topTitle; at = Math.max(0, Math.min(events.length - 1, i || 0));
    place(); fill($('card'), events[at], at); drawTrack(); arrows();
    if (!still) { warp.dir = 1; warp.start = performance.now(); }
    history.replaceState(null, '', location.pathname + location.search + '#s=' + (at + 1));
    $('next').focus({ preventScroll: true });
  }
  $('enter').onclick = function () { enter(0); };

  // ---- the data: data/timeline.json (intro + stations, in order) ----
  fetch('data/timeline.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (j) {
    var intro = j.intro || {};
    if (intro.title) { $('intro-h').textContent = intro.title; document.title = intro.title; }
    topTitle = intro.title || '';
    if (!(j.events || []).length) { $('soon').hidden = false; return; }
    events = j.events;
    var box = $('intro-text');
    box.textContent = ''; para(box, intro.text);
    $('enter').textContent = intro.button || 'Enter the timeline'; $('enter').hidden = false;
    var m = location.hash.match(/^#s=(\d{1,3})$/);
    if (m) enter(+m[1] - 1);
  }).catch(function () { $('soon').hidden = false; });
})();
</script>
</body>
</html>
